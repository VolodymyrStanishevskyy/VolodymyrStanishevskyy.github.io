<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPV Flights</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <header>
        <a href="index.html" class="logo">FPV</a>
        <button class="menu-header" id="mobile-menu-btn" aria-label="Open navigation menu">☰ MENU</button>
    </header>

    <nav class="primary-nav" id="main-nav" aria-label="Primary navigation">
        <a href="history.html">FPV drones history</a>
        <a href="flights.html" class="active" aria-current="page">flights</a>
        <a href="compare.html">compare</a>
        <a href="buy.html">buy drones</a>
    </nav>

    <main class="flights-page">
        <section class="flight-panel" aria-label="Flight videos">
            <header class="flight-icon">
                <img src="image15.png" alt="Training Drone">
            </header>

            <section class="cards-container">
                <article class="video-card video-liftoff">
                    <h2>LIFTOFF</h2>
                    <figure aria-label="Liftoff flight video" style="background: #000; overflow: hidden;">
                        <video autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;">
                            <source src="liftoff.mp4" type="video/mp4">
                            Ваш браузер не підтримує відео.
                        </video>
                    </figure>
                </article>

                <article class="video-card video-uncrashed">
                    <h2>Uncrashed : FPV Drone Simulator</h2>
                    <figure aria-label="Uncrashed flight video" style="background: #000; overflow: hidden;">
                        <video autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;">
                            <source src="uncrashed.mp4" type="video/mp4">
                            Ваш браузер не підтримує відео.
                        </video>
                    </figure>
                </article>
            </section>
        </section>
    </main>

    <footer>
        <p>© 2026 Станішевський В.Є. All rights reserved.</p>
    </footer>

    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mainNav = document.getElementById('main-nav');
        menuBtn.addEventListener('click', function() {
            mainNav.classList.toggle('active');
        });
    </script>

</body>
</html>
